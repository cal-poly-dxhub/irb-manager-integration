[project]
name = "compliance-assistant-api"
version = "0.1.0"
description = "Flask API for the Compliance Assistant chat interface"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "boto3>=1.26.0",
    "pypdf>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compliance_assistant_api"]
