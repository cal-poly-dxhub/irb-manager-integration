[project]
name = "form-parser-api"
version = "0.1.0"
description = "Flask API for form parsing using AWS Textract"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "boto3>=1.26.0",
    "pydantic>=2.0.0",
    "form-parser",
]

[tool.uv.sources]
form-parser = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/form_parser_api"]
