[project]
name = "form-parser"
version = "0.1.0"
description = "Form parsing utilities"
requires-python = ">=3.13"
dependencies = [
    "baml-py>=0.218.1",
    "boto3>=1.26.0",
    "pydantic>=2.0.0",
    "typing-extensions>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baml_client", "src/form_parser"]
